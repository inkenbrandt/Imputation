# Read the Docs build: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The package is installed with its `docs` extra, so autodoc imports the real
# code and the version shown is the installed one. The example notebooks are
# rendered from their committed outputs, not re-executed (CI already checks
# that those outputs come from one clean run).

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  # Matches the CI docs job: a broken link or reference fails the build.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
