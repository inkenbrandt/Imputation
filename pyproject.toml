[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rfr-gapfill"
version = "0.1.0.dev0"
description = "Leakage-safe Random Forest Robust (RFR) gap filling for eddy-covariance flux data, after Zhu et al. (2022)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Paul Inkenbrandt", email = "paulinkenbrandt@gmail.com" }]
keywords = [
    "eddy covariance",
    "gap filling",
    "random forest",
    "FLUXNET",
    "carbon flux",
    "NEE",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]
# Notebooks are deliberately NOT a core or dev requirement; the package core
# must never depend on them.
notebooks = ["jupyter", "matplotlib"]

[project.urls]
Homepage = "https://github.com/paulinkenbrandt/Imputation"
Documentation = "https://github.com/paulinkenbrandt/Imputation/tree/main/docs"

[project.scripts]
rfr-gapfill = "rfrgapfill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rfrgapfill"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: long-running tests (model fitting, end-to-end scenarios)",
    "fluxnet: requires real FLUXNET2015 input data not shipped with the package",
    "supplement: requires the journal supplementary files (mmc*.docx / mmc7.xlsx)",
]
filterwarnings = ["error::DeprecationWarning:rfrgapfill.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Markdown here is specification prose, not formattable source.
extend-exclude = ["*.md"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.10"
files = ["src/rfrgapfill"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "joblib.*"]
ignore_missing_imports = true

# numpy's bundled stubs use `type` statements, which mypy cannot parse while
# python_version targets 3.10. Skip them rather than lower the checked language
# level and stop catching syntax this package's floor does not support.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
source = ["rfrgapfill"]
branch = true
